# .markdownlint-cli2.yaml — repo-bootstrap baseline
# Per the doc-standards skill. Used by the markdownlint-cli2 pre-commit hook.

config:
  MD013:
    line_length: 120
    code_blocks: false
    tables: false
    headings: false
  MD024:
    allow_different_nesting: true
    siblings_only: true
  MD033: false
  MD040: true
  MD045: true
  MD047: true
  MD051: true
  MD053: true
  MD059: true
  MD060: false

ignores:
  - "node_modules/**"
  - ".devbox/**"
  - "vendor/**"
  - "docs/archive/**"

fix: true
